<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test GitHub Pages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f1f5f9;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #7dd3fc;
    }

    #wynik {
      margin-top: 20px;
      font-size: 18px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Strona testowa GitHub Pages</h1>
    <p>
      Jeśli widzisz tę stronę online, hosting przez GitHub Pages działa poprawnie.
    </p>
    <button onclick="pokazWiadomosc()">Kliknij mnie</button>
    <p id="wynik"></p>
  </main>

  <script>
    function pokazWiadomosc() {
      document.getElementById("wynik").textContent = "Działa! JavaScript też jest hostowany.";
    }
  </script>
</body>
</html>
